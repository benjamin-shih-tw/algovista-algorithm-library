name: Deploy AlgoVista to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit catalog integrity
        run: npm run audit:catalog
      - name: Audit teaching templates
        run: npm run audit:templates
      - name: Audit knowledge graph
        run: npm run audit:knowledge
      - name: Deep renderer safety scan
        run: npm run audit:deep
      - name: Upload deep renderer scan
        uses: actions/upload-artifact@v4
        with:
          name: deep-renderer-scan
          path: .tmp/deep-scan.json
      - name: Audit AP325 Guide
        run: npm run audit:ap325
      - name: Audit animation structure
        run: npm run audit:animation:stage1
      - name: Upload animation audit
        uses: actions/upload-artifact@v4
        with:
          name: stage1-animation-audit
          path: |
            .tmp/stage1-animation-audit.json
            .tmp/stage1-animation-audit.md
      - name: Probe representative animation semantics
        run: npm run audit:animation:stage2
      - name: Upload Stage 2 semantic probe
        uses: actions/upload-artifact@v4
        with:
          name: stage2-semantic-probe
          path: .tmp/stage2-semantic-probe.json
      - name: Generate Stage 2 remediation matrix
        run: npm run audit:animation:stage2:matrix
      - name: Upload Stage 2 remediation matrix
        uses: actions/upload-artifact@v4
        with:
          name: stage2-remediation-matrix
          path: |
            .tmp/stage2-remediation-matrix.json
            .tmp/stage2-remediation-matrix.md
      - name: Audit primary animation-code sync
        run: npm run audit:animation:stage3
      - name: Upload Stage 3 code-sync audit
        uses: actions/upload-artifact@v4
        with:
          name: stage3-code-sync-audit
          path: .tmp/stage3-code-sync-audit.json
      - name: Audit execution-trace progress
        run: npm run audit:animation:stage5
      - name: Upload Stage 5 execution progress
        uses: actions/upload-artifact@v4
        with:
          name: stage5-execution-progress
          path: .tmp/stage5-execution-progress.json
      - name: Build
        run: npm run build
      - name: Upload lesson payload size report
        uses: actions/upload-artifact@v4
        with:
          name: lesson-payload-sizes
          path: .tmp/lesson-payload-sizes.json
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  cpp-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit C++17 compilation coverage
        continue-on-error: true
        run: mkdir -p .tmp && CPP_AUDIT_VERBOSE=1 npm run audit:cpp
      - name: Upload C++17 compilation audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpp17-compilation-audit
          path: .tmp/cppAuditReport.json

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
