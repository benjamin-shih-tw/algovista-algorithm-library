name: Deploy AlgoVista to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit AP325 Guide
        run: npm run audit:ap325
      - name: Audit animation structure
        run: npm run audit:animation:stage1
      - name: Upload animation audit
        uses: actions/upload-artifact@v4
        with:
          name: stage1-animation-audit
          path: |
            .tmp/stage1-animation-audit.json
            .tmp/stage1-animation-audit.md
      - name: Probe representative animation semantics
        run: npm run audit:animation:stage2
      - name: Upload Stage 2 semantic probe
        uses: actions/upload-artifact@v4
        with:
          name: stage2-semantic-probe
          path: .tmp/stage2-semantic-probe.json
      - name: Generate Stage 2 remediation matrix
        run: npm run audit:animation:stage2:matrix
      - name: Upload Stage 2 remediation matrix
        uses: actions/upload-artifact@v4
        with:
          name: stage2-remediation-matrix
          path: |
            .tmp/stage2-remediation-matrix.json
            .tmp/stage2-remediation-matrix.md
      - name: Build
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
